name: tests

# No secrets are configured for this workflow, and none are needed.
#
# The whole RAG path is testable without an API key, a model download or a
# network call, because every heavy dependency (Anthropic, ChromaDB,
# Sentence Transformers, PyMuPDF) sits behind an injected interface. That is a
# deliberate design property, and this workflow is what proves it: if a change
# ever makes the suite require a credential, CI fails.
#
# The one thing that does cost money -- eval/evaluate_answers.py, which calls
# Claude -- is intentionally NOT run here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Only what the tests actually need. The heavy optional dependencies are
        # deliberately absent, which exercises the offline fallback paths.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Run tests (pytest)
        run: pytest tests/ -q

      - name: Run tests (zero-dependency runner)
        # The suite must also pass without pytest installed, so the project can
        # be verified on a bare Python install.
        run: python run_tests.py

      - name: Verify no API key is present
        # Guards the claim above: if these tests ever start depending on a
        # credential, this job is where it surfaces.
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is set in CI; the suite must not need it."
            exit 1
          fi
          echo "No ANTHROPIC_API_KEY in the environment - as intended."
